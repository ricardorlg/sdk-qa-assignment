name: sdk-ci

on:
  pull_request:
  push:
    tags: ["rc-*"]
  schedule:
    - cron: "0 2 * * *"   # nightly: full matrix
  workflow_dispatch:

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- PR fast gate (blocking): contracts L2a/L2b on both platforms -------------
  contracts-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: L2a signature contract (apiCheck)
        run: gradle -p android apiCheck --console=plain
      - name: L2b behaviour contract (core + consumer scenarios)
        run: |
          node fake-auth-server/server.js & sleep 1
          CONTRACT_DIR=$PWD/contracts gradle -p android test --console=plain

  contracts-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: L2a signature contract (swiftinterface diff vs committed baseline)
        run: EMIT=$RUNNER_TEMP/AuthSDK.swiftinterface tools/ios_api.sh check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-api-generated
          path: ${{ runner.temp }}/AuthSDK.swiftinterface
      - name: L2a breaking-change classification (swift-api-digester vs last release tag)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0 --match 'v*' || true)
          [ -z "$TAG" ] && { echo "no release tag yet, skipping"; exit 0; }
          git worktree add /tmp/base "$TAG"
          (cd /tmp/base/ios && xcodebuild build -scheme AuthSDK -derivedDataPath /tmp/base-dd \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -destination "generic/platform=iOS Simulator" BUILD_LIBRARY_FOR_DISTRIBUTION=YES -quiet)
          tools/ios_api.sh breaking /tmp/base-dd
      - name: L2b behaviour contract
        run: |
          node fake-auth-server/server.js & sleep 1
          CONTRACT_DIR=$PWD/contracts swift test --package-path ios

  # ---- Selection: path filter + matrix generated from compat.yaml -----------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      native_changed: ${{ steps.f.outputs.native }}
      native_ui_android: ${{ steps.gen.outputs.native_ui_android }}
      native_ui_ios: ${{ steps.gen.outputs.native_ui_ios }}
      contract_vs_release: ${{ steps.gen.outputs.contract_vs_release }}
      canary: ${{ steps.gen.outputs.canary }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            native:
              - 'android/src/**'
              - 'android-instrumented/**'
              - 'ios/Sources/**'
              - 'ios-host/**'
      - run: pip install pyyaml
      - id: gen
        run: |
          MODE=pr
          if [[ "${{ github.ref }}" == refs/tags/rc-* || "${{ github.event_name }}" == "schedule" ]]; then MODE=rc; fi
          python3 tools/gen_matrix.py $MODE > matrix.json
          for k in native_ui_android native_ui_ios contract_vs_release canary; do
            echo "$k=$(python3 -c "import json;print(json.dumps(json.load(open('matrix.json'))['$k']))")" >> "$GITHUB_OUTPUT"
          done

  # ---- L3b native UI + lifecycle (PR: only when paths changed; nightly/RC: always) --
  native-ui-android:
    needs: plan
    if: needs.plan.outputs.native_changed == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.native_ui_android).os }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Espresso on API ${{ matrix.os }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.os }}
          target: google_apis
          arch: x86_64
          script: |
            tools/retry_flag_flaky.sh env PLATFORM=android ./run_native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flaky-report-android-${{ matrix.os }}
          path: flaky-report.txt
          if-no-files-found: ignore

  native-ui-ios:
    needs: plan
    if: needs.plan.outputs.native_changed == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.native_ui_ios).os }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: brew install xcodegen
      - name: XCUITest on iOS ${{ matrix.os }}
        run: tools/retry_flag_flaky.sh env PLATFORM=ios "IOS_DEST=platform=iOS Simulator,name=iPhone 16,OS=${{ matrix.os }}" ./run_native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flaky-report-ios-${{ matrix.os }}
          path: flaky-report.txt
          if-no-files-found: ignore

  # ---- RC only: backward compatibility and consumer canary --------------------------
  contract-vs-release:
    needs: plan
    if: needs.plan.outputs.contract_vs_release != 'null'
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.contract_vs_release) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the current scenario suite against release ${{ matrix.release }}
        run: echo "TODO check out tag v${{ matrix.release }} of the module and run contracts/ against it (specified, not yet implemented)"

  consumer-canary:
    needs: plan
    if: needs.plan.outputs.canary != 'null'
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.canary) }}
    runs-on: ubuntu-latest
    steps:
      - name: Differential canary for ${{ matrix.app }}
        run: echo "TODO build ${{ matrix.app }} against RC and against the previous SDK; failure only on RC => SDK regression (specified, not yet implemented)"
