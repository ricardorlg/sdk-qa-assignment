name: 2-native-ui

# Stage 2: slow native UI + lifecycle tests (Espresso / XCUITest) over the OS matrix in compat.yaml.
# Not a PR gate: runs nightly, on demand, and is called by the release stage.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: native-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.gen.outputs.android }}
      ios: ${{ steps.gen.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - run: pip install pyyaml
      - id: gen
        run: |
          python3 tools/gen_matrix.py rc > matrix.json
          echo "android=$(python3 -c "import json;print(json.dumps(json.load(open('matrix.json'))['native_ui_android']))")" >> "$GITHUB_OUTPUT"
          echo "ios=$(python3 -c "import json;print(json.dumps(json.load(open('matrix.json'))['native_ui_ios']))")" >> "$GITHUB_OUTPUT"

  android:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.android).os }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Espresso on API ${{ matrix.os }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.os }}
          target: google_apis
          arch: x86_64
          script: |
            tools/retry_flag_flaky.sh env PLATFORM=android ./run_native.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flaky-report-android-${{ matrix.os }}
          path: flaky-report.txt
          if-no-files-found: ignore

  ios:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.ios).os }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: brew install xcodegen
      - name: XCUITest on iOS ${{ matrix.os }}
        run: tools/retry_flag_flaky.sh env PLATFORM=ios "IOS_DEST=platform=iOS Simulator,name=iPhone 16,OS=${{ matrix.os }}" ./run_native.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flaky-report-ios-${{ matrix.os }}
          path: flaky-report.txt
          if-no-files-found: ignore
